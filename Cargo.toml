[package]
name = "ml_lib"
version = "0.1.0"
edition = "2024"

[lib]
name = "ml_lib"
path = "src/lib.rs"

[dependencies]
rand = "0.9.2"
rand_distr = "0.5.1"
indicatif = "0.18.3"
serde = { version = "1.0.228", features = ["derive"] }
bitcode = { version = "0.6.9", features = ["serde"]}

[features]
parallel_ops = ["rayon"]

[dependencies.rayon]
version = "1.11.0"
optional = true
